---
- name: Install base neovim
  hosts: localhost
  connection: local
  gather_facts: yes
    
  vars:
    user_home: "{{ lookup('env', 'HOME') }}"
    nvim_config: "{{ user_home }}/.config/nvim/"
    nvim_path: /opt/nvim
    nvim_bin: /usr/local/bin/nvim
    arch_map:
      x86_64: x86_64
      aarch64: arm64
    nvim_url: "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-{{ arch_map[ansible_architecture] }}.tar.gz"
    
  pre_tasks:

    - name: Remove old neovim installation
      become: true
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ nvim_path }}"
        - "{{ user_home }}/.local/share/nvim"
        - "{{ user_home }}/.local/state/nvim"
        - "{{ nvim_config }}" 

    - name: Ensure {{ nvim_config }} exist
      file:
        path: "{{ nvim_config }}"
        state: directory
        mode: "0755"

    - name: Ensure {{ nvim_path }} exist
      become: true
      file:
        path: "{{ nvim_path }}"
        state: directory
        mode: "0755"

  tasks:

    - name: Download neovim archive for architecture {{ arch_map[ansible_architecture] }}
      get_url:
        url: "{{ nvim_url }}"
        dest: /tmp/nvim.tar.gz
        mode: "0644"
        force: true

    - name: Extract neovim to {{ nvim_path }}
      become: true
      unarchive:
        src: /tmp/nvim.tar.gz
        dest: "{{ nvim_path }}"
        extra_opts: [--strip-components=1]
        remote_src: true

    - name: Ensure symlink for nvim in {{ nvim_bin }}
      become: true
      file:
        src: "{{ nvim_path }}/bin/nvim"
        dest: "{{ nvim_bin }}"
        state: link
        force: true
    
    - name: Download starter config from git
      git:
        repo: "https://github.com/LazyVim/starter"
        dest: "{{ nvim_config }}"
        version: HEAD
        force: yes

    - name: Remove .git files 
      become: true
      file:
        path: "{{ nvim_config }}/.git"
        state: absent

