##### Base #####
# Terminal moderne
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Activer la souris (scroll / clic / resize panes)
set -g mouse on

# Mode vi (copy-mode, navigation)
setw -g mode-keys vi

# Navigation vim-like entre panes (Ctrl+h/j/k/l)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize rapide des panes (Alt+flèches)
bind -n M-Left resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up resize-pane -U 1
bind -n M-Down resize-pane -D 1

# Synchroniser les panes (même commande partout)
bind S setw synchronize-panes

# Reload rapide de la config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

##### Status bar #####
set -g status-interval 5
set -g status-justify centre

# Contenu (ajusté par les thèmes mais base définie)
set -g status-left " #[bold]#S "
set -g status-right " #(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-') | %Y-%m-%d %H:%M "

##### Plugins (TPM) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'    # réglages par défaut utiles
set -g @plugin 'tmux-plugins/tmux-resurrect'   # sauvegarde/restauration des sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # autosave sessions
set -g @plugin 'tmux-plugins/tmux-yank'        # copier dans le presse-papier

# Thèmes
set -g @plugin 'catppuccin/tmux'

# Config Catppuccin (variante claire/sombre)
set -g @catppuccin_flavour 'mocha'   # sombre par défaut

##### Toggle Light/Dark #####
set -g @theme 'dark'

# Charger par défaut le thème sombre
if '[ "#{@theme}" = "dark" ]' 'source ~/.tmux/plugins/catppuccin/tmux/catppuccin.conf'

# Toggle avec Prefix + T
bind-key T if -F '#{==:#{@theme},dark}' \
  'set -g @theme light \; set -g @catppuccin_flavour latte \; source ~/.tmux/plugins/catppuccin/tmux/catppuccin.conf \; display-message "Theme: Catppuccin Latte ☀️"' \
  'set -g @theme dark \; set -g @catppuccin_flavour mocha \; source ~/.tmux/plugins/catppuccin/tmux/catppuccin.conf \; display-message "Theme: Catppuccin Mocha 🌙"'

##### Lancer TPM (toujours en dernier) #####
run -b '~/.tmux/plugins/tpm/tpm'

